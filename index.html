<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sajtburger Kaland - Jégvarázs Kiadás</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .game-font {
            font-family: 'Fredoka One', cursive;
        }

        canvas {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 70%, #FFFFFF 100%);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.6);
            display: block;
            touch-action: none;
        }

        /* Mobil gombok stílusa */
        .touch-btn {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2), inset 0 2px 4px rgba(255,255,255,0.4);
            transition: transform 0.05s ease, background 0.1s ease;
        }

        .touch-btn:active, .touch-btn.active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.5);
        }

        /* Karakterkártyák csillogó effektje */
        .char-card {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .char-card:hover {
            transform: translateY(-8px) scale(1.03);
            background: rgba(255, 255, 255, 0.3);
            border-color: #38bdf8;
            box-shadow: 0 12px 25px rgba(56, 189, 248, 0.4);
        }

        /* Fagyos ragyogás */
        .ice-glow {
            text-shadow: 0 0 10px rgba(186, 230, 253, 0.8), 0 0 20px rgba(56, 189, 248, 0.6);
        }

        /* Egyedi görgetősáv elrejtése */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center p-2 md:p-4 text-white select-none">

    <div class="relative w-full max-w-4xl h-full max-h-[700px] flex flex-col items-center justify-between">

        <!-- FELSŐ SÁV (HUD) -->
        <header class="w-full flex items-center justify-between px-4 py-2 bg-white/10 backdrop-blur-md rounded-2xl border border-white/20 shadow-lg z-10 mb-2">
            <div class="flex items-center space-x-3">
                <div class="text-2xl md:text-3xl" id="hudCharIcon">🐶</div>
                <div>
                    <h2 class="game-font text-sm md:text-base text-sky-200 tracking-wide" id="hudCharName">Ármika</h2>
                    <div class="flex items-center space-x-1" id="livesContainer">

            </div>

            <div class="text-center">
                <span class="text-xs uppercase tracking-widest text-sky-200 font-bold block">Pontszám</span>
                <span class="game-font text-xl md:text-2xl text-yellow-300" id="scoreDisplay">0 🍔</span>
            </div>

            <div class="flex items-center space-x-2">
                <button id="audioToggle" class="p-2.5 bg-sky-500/40 hover:bg-sky-500/60 border border-sky-300/50 rounded-xl transition text-lg" title="Zene Be/Ki">
                    🔊
                </button>
                <button id="restartBtn" class="p-2.5 bg-emerald-500/40 hover:bg-emerald-500/60 border border-emerald-300/50 rounded-xl transition text-lg" title="Újrajáték">
                    🔄
                </button>
            </div>
        </header>

        <!-- CANVAS ÉS MEGJELENÍTŐ KÖRNYEZET -->
        <div class="relative w-full flex-1 flex items-center justify-center overflow-hidden">
            <canvas id="gameCanvas" class="w-full h-full object-contain"></canvas>

            <!-- KARAKTER VÁLASZTÓ KÉPERNYŐ OVERLAY -->
            <div id="characterSelectScreen" class="absolute inset-0 bg-slate-900/85 backdrop-blur-md flex flex-col items-center justify-center p-4 rounded-2xl z-20">

                <p class="text-sky-100 text-sm md:text-base mb-6 text-center font-medium max-w-md">

                    </button>

                    <!-- Flóra -->
                    <button onclick="selectCharacter('flora')" class="char-card p-3 rounded-2xl flex flex-col items-center text-center cursor-pointer">
                        <div class="text-4xl md:text-5xl mb-2">💃</div>
                        <h3 class="game-font text-base text-white">Flóra</h3>
                        <p class="text-xs text-pink-200 mt-1">A gyönyörű modell</p>

                    <!-- Anna -->

                    <!-- Emma -->
                    <button onclick="selectCharacter('emma')" class="char-card p-3 rounded-2xl flex flex-col items-center text-center cursor-pointer">

                    </button>

                    <!-- Sánci -->
                    <button onclick="selectCharacter('sanci')" class="char-card p-3 rounded-2xl flex flex-col items-center text-center cursor-pointer col-span-2 sm:col-span-1">
                        <div class="text-4xl md:text-5xl mb-2">⚽</div>
                        <h3 class="game-font text-base text-white">Sánci</h3>
                        <p class="text-xs text-amber-200 mt-1">A gyors focista</p>
                        <span class="mt-2 text-[10px] bg-amber-500/30 text-amber-200 px-2 py-0.5 rounded-full border border-amber-300/30">Szuper sebesség</span>
                    </button>
                </div>

                <!-- Irányítási útmutató -->
                <div class="flex flex-wrap items-center justify-center gap-4 text-xs text-sky-200 bg-sky-950/60 px-4 py-2 rounded-xl border border-sky-400/20">
                    <span class="flex items-center gap-1">💻 <b>PC:</b> Nyilak / WASD / Szóköz</span>
                    <span class="flex items-center gap-1">📱 <b>Mobil:</b> Képernyő gombok</span>
                </div>
            </div>

            <!-- JÁTÉK VÉGE / GYŐZELEM MODAL -->
            <div id="gameOverModal" class="hidden absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 rounded-2xl z-30">
                <h2 id="modalTitle" class="game-font text-4xl md:text-6xl text-rose-400 mb-2 ice-glow">JÁTÉK VÉGE</h2>
                <p id="modalMessage" class="text-sky-100 text-base md:text-lg mb-6 text-center">Elfogyott az összes életed!</p>
                <button onclick="resetGame()" class="game-font px-8 py-3 bg-gradient-to-r from-sky-400 to-blue-600 hover:from-sky-300 hover:to-blue-500 text-white text-lg rounded-2xl shadow-lg transform hover:scale-105 transition">
                    ÚJRA PRÓBÁLOM 🚀
                </button>
            </div>
        </div>

        <!-- MOBIL IRÁNYÍTÓ GOMBOK -->
        <div class="w-full flex items-center justify-between px-2 py-2 mt-1">
            <!-- Bal / Jobb nyilak -->
            <div class="flex space-x-3">
                <button id="btnLeft" class="touch-btn w-16 h-16 md:w-20 md:h-20 rounded-2xl flex items-center justify-center text-2xl md:text-3xl text-white">
                    ◀
                </button>
                <button id="btnRight" class="touch-btn w-16 h-16 md:w-20 md:h-20 rounded-2xl flex items-center justify-center text-2xl md:text-3xl text-white">
                    ▶
                </button>
            </div>

            <!-- Nevek felirata lent középen -->
            <div class="hidden sm:block text-center text-xs text-sky-200/60 font-medium">
                Ármika • Flóra • Anna • Emma • Sánci
            </div>

            <!-- Ugrás gomb -->
            <div>
                <button id="btnJump" class="touch-btn w-16 h-16 md:w-20 md:h-20 rounded-2xl flex items-center justify-center text-2xl md:text-3xl text-white bg-sky-500/30">
                    ▲
                </button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           1. ZENE ÉS HANGEFFEKT ENGINE (Web Audio API - Téli / Jégvarázs dallam)
           ========================================================================== */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.isPlaying = false;
                this.muted = false;
                this.musicInterval = null;
                this.noteIndex = 0;
                
                // Frozen "Let It Go" jellegű fagyos dallam hangjegyei (Frekvencia Hz)
                this.melody = [
                    { note: 349.23, duration: 400 }, // F4
                    { note: 392.00, duration: 400 }, // G4
                    { note: 415.30, duration: 400 }, // G#4
                    { note: 349.23, duration: 600 }, // F4
                    { note: 311.13, duration: 400 }, // D#4
                    { note: 349.23, duration: 400 }, // F4
                    { note: 392.00, duration: 400 }, // G4
                    { note: 415.30, duration: 400 }, // G#4
                    { note: 466.16, duration: 800 }, // A#4
                    { note: 523.25, duration: 400 }, // C5
                    { note: 466.16, duration: 400 }, // A#4
                    { note: 415.30, duration: 600 }, // G#4
                ];
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            startMusic() {
                this.init();
                if (this.isPlaying || this.muted) return;
                this.isPlaying = true;
                
                const playNextNote = () => {
                    if (!this.isPlaying || this.muted) return;
                    const item = this.melody[this.noteIndex];
                    this.playNote(item.note, item.duration / 1000, 'sine', 0.05);
                    this.noteIndex = (this.noteIndex + 1) % this.melody.length;
                    this.musicInterval = setTimeout(playNextNote, item.duration);
                };

                playNextNote();
            }

            stopMusic() {
                this.isPlaying = false;
                if (this.musicInterval) clearTimeout(this.musicInterval);
            }

            toggleMute() {
                this.muted = !this.muted;
                if (this.muted) {
                    this.stopMusic();
                } else {
                    this.startMusic();
                }
                return this.muted;
            }

            playNote(freq, duration, type = 'sine', volume = 0.1) {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playJump() {
                this.init();
                this.playNote(400, 0.15, 'triangle', 0.15);
                setTimeout(() => this.playNote(600, 0.2, 'triangle', 0.12), 50);
            }

            playCollect() {
                this.init();
                this.playNote(523.25, 0.1, 'sine', 0.2);
                setTimeout(() => this.playNote(659.25, 0.1, 'sine', 0.2), 80);
                setTimeout(() => this.playNote(783.99, 0.2, 'sine', 0.25), 160);
            }

            playHurt() {
                this.init();
                this.playNote(180, 0.2, 'sawtooth', 0.2);
                setTimeout(() => this.playNote(120, 0.3, 'sawtooth', 0.2), 100);
            }

            playWin() {
                this.init();
                const winNotes = [523.25, 659.25, 783.99, 1046.50];
                winNotes.forEach((n, i) => {
                    setTimeout(() => this.playNote(n, 0.25, 'triangle', 0.2), i * 120);
                });
            }
        }

        const soundEngine = new SoundEngine();

        /* ==========================================================================
           2. KARAKTEREK ADATAI ÉS JÁTÉK ÁLLAPOT
           ========================================================================== */
        const CHARACTERS = {
            armika: {
                name: "Ármika",
                title: "Bolognese kutya",
                icon: "🐶",
                color: "#F8FAFC",
                speed: 4.5,
                jumpPower: -11.5,
                gravity: 0.45,
                lives: 3,
                scoreMult: 1
            },
            flora: {
                name: "Flóra",
                title: "A modell",
                icon: "💃",
                color: "#F472B6",
                speed: 4.8,
                jumpPower: -10.5,
                gravity: 0.35, // Lassabb esés (modell lebegés)
                lives: 3,
                scoreMult: 1
            },
            anna: {
                name: "Anna",
                title: "Hercegnő",
                icon: "👑",
                color: "#C084FC",
                speed: 4.5,
                jumpPower: -10.5,
                gravity: 0.45,
                lives: 4, // Extra élet
                scoreMult: 1
            },
            emma: {
                name: "Emma",
                title: "Az okos",
                icon: "🧠",
                color: "#34D399",
                speed: 4.5,
                jumpPower: -10.5,
                gravity: 0.45,
                lives: 3,
                scoreMult: 2 // Dupla pontok
            },
            sanci: {
                name: "Sánci",
                title: "A focista",
                icon: "⚽",
                color: "#FBBF24",
                speed: 6.0, // Gyorsabb mozgás
                jumpPower: -10.5,
                gravity: 0.45,
                lives: 3,
                scoreMult: 1
            }
        };

        let selectedCharKey = 'armika';
        let lives = 3;
        let score = 0;
        let isGameOver = false;
        let isGameWon = false;

        /* ==========================================================================
           3. CANVAS ÉS PÁLYA BEÁLLÍTÁSOK
           ========================================================================== */
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Canvas méretezés a konténerhez
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        // Játékos objektum
        const player = {
            x: 50,
            y: 200,
            width: 34,
            height: 44,
            vx: 0,
            vy: 0,
            grounded: false,
            facingRight: true,
            invulnerableTimer: 0
        };

        // Kamera pozíció
        let cameraX = 0;
        const LEVEL_WIDTH = 3200;

        // Háttér hópelyhek
        const snowflakes = Array.from({ length: 60 }, () => ({
            x: Math.random() * LEVEL_WIDTH,
            y: Math.random() * 600,
            radius: Math.random() * 3 + 1,
            speedY: Math.random() * 1 + 0.5,
            speedX: Math.random() * 0.5 - 0.25
        }));

        // Platformok struktúrája
        let platforms = [];
        // Sajtburgerek
        let burgers = [];
        // Ellenfelek (guruló hógolyók)
        let enemies = [];
        // Cél zászló
        const goalFlag = { x: 3050, y: 180, width: 40, height: 120 };

        function initLevel() {
            // Platformok generálása
            platforms = [
                // Kezdő talaj
                { x: 0, y: 380, width: 750, height: 100, type: 'ice' },
                { x: 850, y: 380, width: 600, height: 100, type: 'ice' },
                { x: 1550, y: 380, width: 700, height: 100, type: 'ice' },
                { x: 2350, y: 380, width: 850, height: 100, type: 'ice' },

                // Égi / Lebegő platformok
                { x: 220, y: 280, width: 120, height: 20, type: 'cloud' },
                { x: 400, y: 210, width: 140, height: 20, type: 'cloud' },
                { x: 600, y: 270, width: 120, height: 20, type: 'cloud' },

                // Mozgó platform 1
                { x: 760, y: 320, width: 100, height: 20, type: 'moving', startX: 740, endX: 840, speed: 1.5, dir: 1 },

                { x: 950, y: 260, width: 130, height: 20, type: 'cloud' },
                { x: 1150, y: 200, width: 130, height: 20, type: 'cloud' },
                { x: 1350, y: 270, width: 130, height: 20, type: 'cloud' },

                // Mozgó platform 2 (Függőleges)
                { x: 1490, y: 300, width: 90, height: 20, type: 'movingY', startY: 180, endY: 320, speed: 1.2, dir: 1 },

                { x: 1650, y: 250, width: 140, height: 20, type: 'cloud' },
                { x: 1850, y: 190, width: 140, height: 20, type: 'cloud' },
                { x: 2050, y: 260, width: 140, height: 20, type: 'cloud' },

                // Tüskés/Veszélyes fagyos zóna előtti lépcsők
                { x: 2280, y: 310, width: 80, height: 20, type: 'cloud' },
                { x: 2450, y: 270, width: 120, height: 20, type: 'cloud' },
                { x: 2650, y: 210, width: 150, height: 20, type: 'cloud' },
                { x: 2850, y: 270, width: 120, height: 20, type: 'cloud' },
            ];

            // Sajtburgerek elhelyezése
            burgers = [
                { x: 260, y: 240, collected: false },
                { x: 450, y: 170, collected: false },
                { x: 650, y: 230, collected: false },
                { x: 800, y: 270, collected: false },
                { x: 1000, y: 220, collected: false },
                { x: 1200, y: 160, collected: false },
                { x: 1400, y: 230, collected: false },
                { x: 1700, y: 210, collected: false },
                { x: 1900, y: 150, collected: false },
                { x: 2100, y: 220, collected: false },
                { x: 2500, y: 230, collected: false },
                { x: 2720, y: 170, collected: false },
                { x: 2900, y: 230, collected: false },
            ];

            // Ellenfelek (Hógolyó szörnyek)
            enemies = [
                { x: 400, y: 350, width: 30, height: 30, speed: 1.5, dir: 1, minX: 300, maxX: 650 },
                { x: 1000, y: 350, width: 30, height: 30, speed: 2.0, dir: -1, minX: 900, maxX: 1300 },
                { x: 1750, y: 350, width: 30, height: 30, speed: 1.8, dir: 1, minX: 1600, maxX: 2100 },
                { x: 2500, y: 350, width: 30, height: 30, speed: 2.2, dir: -1, minX: 2400, maxX: 2800 },
            ];
        }

        /* ==========================================================================
           4. IRÁNYÍTÁS (Billentyűzet + Touch gombok)
           ========================================================================== */
        const keys = { left: false, right: false, jump: false };

        // Billentyűzet események (PC)
        window.addEventListener("keydown", (e) => {
            if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
            if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
            if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") {
                if (!keys.jump && player.grounded) {
                    doJump();
                }
                keys.jump = true;
            }
        });

        window.addEventListener("keyup", (e) => {
            if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
            if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
            if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") keys.jump = false;
        });

        // Touch Gombok eseményei (Mobil)
        function bindTouchBtn(btnId, keyName) {
            const btn = document.getElementById(btnId);
            
            const startPress = (e) => {
                e.preventDefault();
                btn.classList.add("active");
                if (keyName === 'jump') {
                    if (!keys.jump && player.grounded) doJump();
                }
                keys[keyName] = true;
                soundEngine.init();
            };

            const endPress = (e) => {
                e.preventDefault();
                btn.classList.remove("active");
                keys[keyName] = false;
            };

            btn.addEventListener("touchstart", startPress, { passive: false });
            btn.addEventListener("touchend", endPress, { passive: false });
            btn.addEventListener("mousedown", startPress);
            btn.addEventListener("mouseup", endPress);
            btn.addEventListener("mouseleave", endPress);
        }

        bindTouchBtn("btnLeft", "left");
        bindTouchBtn("btnRight", "right");
        bindTouchBtn("btnJump", "jump");

        function doJump() {
            const charStats = CHARACTERS[selectedCharKey];
            player.vy = charStats.jumpPower;
            player.grounded = false;
            soundEngine.playJump();
        }

        /* ==========================================================================
           5. KARAKTER VÁLASZTÁS ÉS HUD FRISSÍTÉS
           ========================================================================== */
        function selectCharacter(charKey) {
            selectedCharKey = charKey;
            const charStats = CHARACTERS[charKey];
            
            lives = charStats.lives;
            score = 0;
            isGameOver = false;
            isGameWon = false;

            document.getElementById("hudCharIcon").innerText = charStats.icon;
            document.getElementById("hudCharName").innerText = charStats.name;
            document.getElementById("characterSelectScreen").classList.add("hidden");
            document.getElementById("gameOverModal").classList.add("hidden");

            updateHUD();
            resetPlayerPosition();
            initLevel();
            soundEngine.startMusic();
        }

        function updateHUD() {
            // Életek szveges/ikonos megjelenítése
            const container = document.getElementById("livesContainer");
            container.innerHTML = "";
            for (let i = 0; i < lives; i++) {
                const heart = document.createElement("span");
                heart.className = "text-base md:text-lg animate-pulse";
                heart.innerText = "❤️";
                container.appendChild(heart);
            }
            document.getElementById("scoreDisplay").innerText = `${score} 🍔`;
        }

        function resetPlayerPosition() {
            player.x = 50;
            player.y = 200;
            player.vx = 0;
            player.vy = 0;
            player.grounded = false;
            cameraX = 0;
        }

        function resetGame() {
            document.getElementById("characterSelectScreen").classList.remove("hidden");
            document.getElementById("gameOverModal").classList.add("hidden");
        }

        // Gomb eseménykezelők a HUD-ban
        document.getElementById("audioToggle").addEventListener("click", () => {
            const muted = soundEngine.toggleMute();
            document.getElementById("audioToggle").innerText = muted ? "🔇" : "🔊";
        });

        document.getElementById("restartBtn").addEventListener("click", () => {
            resetGame();
        });

        /* ==========================================================================
           6. FIZIKA ÉS ÜTKÖZÉSEK
           ========================================================================== */
        function updatePhysics() {
            if (isGameOver || isGameWon) return;

            const charStats = CHARACTERS[selectedCharKey];

            // Vízszintes mozgás
            if (keys.left) {
                player.vx = -charStats.speed;
                player.facingRight = false;
            } else if (keys.right) {
                player.vx = charStats.speed;
                player.facingRight = true;
            } else {
                player.vx *= 0.8; // Súrlódás
            }

            // Gravitáció alkalmazása
            player.vy += charStats.gravity;

            // Pozíciók frissítése
            player.x += player.vx;
            player.y += player.vy;

            // Pálya határok
            if (player.x < 0) player.x = 0;
            if (player.x > LEVEL_WIDTH - player.width) player.x = LEVEL_WIDTH - player.width;

            // Platform ütközések
            player.grounded = false;

            platforms.forEach(p => {
                // Mozgó platformok frissítése
                if (p.type === 'moving') {
                    p.x += p.speed * p.dir;
                    if (p.x > p.endX || p.x < p.startX) p.dir *= -1;
                }
                if (p.type === 'movingY') {
                    p.y += p.speed * p.dir;
                    if (p.y > p.endY || p.y < p.startY) p.dir *= -1;
                }

                // AABB Ütközés vizsgálat
                if (player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y + player.height > p.y &&
                    player.y + player.height < p.y + p.height + player.vy + 2 &&
                    player.vy >= 0) {
                    
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;

                    // Ha mozgó platformon áll, mozogjon vele
                    if (p.type === 'moving') player.x += p.speed * p.dir;
                }
            });

            // Ellenfelek frissítése és ütközés
            enemies.forEach(e => {
                e.x += e.speed * e.dir;
                if (e.x > e.maxX || e.x < e.minX) e.dir *= -1;

                // Játékos-Ellenfél ütközés
                if (player.invulnerableTimer <= 0 &&
                    player.x < e.x + e.width &&
                    player.x + player.width > e.x &&
                    player.y < e.y + e.height &&
                    player.y + player.height > e.y) {
                    
                    // Ha a fejére ugrik
                    if (player.vy > 0 && player.y + player.height < e.y + 15) {
                        player.vy = charStats.jumpPower * 0.75;
                        e.x = -999; // Ellenfél legyőzése
                        score += 50 * charStats.scoreMult;
                        soundEngine.playCollect();
                    } else {
                        // Sérülés
                        playerHurt();
                    }
                }
            });

            // Sebezhetetlenség számláló
            if (player.invulnerableTimer > 0) player.invulnerableTimer--;

            // Sajtburger felvétel
            burgers.forEach(b => {
                if (!b.collected &&
                    player.x < b.x + 30 &&
                    player.x + player.width > b.x &&
                    player.y < b.y + 30 &&
                    player.y + player.height > b.y) {
                    
                    b.collected = true;
                    score += 100 * charStats.scoreMult;
                    lives++; // Sajtburger extra életet is ad!
                    updateHUD();
                    soundEngine.playCollect();
                }
            });

            // Leesés ellenőrzése
            if (player.y > 500) {
                playerHurt(true);
            }

            // Győzelem ellenőrzése (Zászló elérése)
            if (player.x < goalFlag.x + goalFlag.width &&
                player.x + player.width > goalFlag.x &&
                player.y < goalFlag.y + goalFlag.height &&
                player.y + player.height > goalFlag.y) {
                
                winGame();
            }

            // Kamera követés (Középre igazítás)
            cameraX = player.x - canvas.width / 2 + player.width / 2;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > LEVEL_WIDTH - canvas.width) cameraX = LEVEL_WIDTH - canvas.width;
        }

        function playerHurt(fellOff = false) {
            lives--;
            updateHUD();
            soundEngine.playHurt();

            if (lives <= 0) {
                endGame(false);
            } else {
                player.invulnerableTimer = 60; // 1 másodperc védelmet ad
                if (fellOff) {
                    player.x = Math.max(50, player.x - 200);
                    player.y = 150;
                    player.vy = 0;
                } else {
                    player.vy = -6;
                }
            }
        }

        function endGame(won) {
            isGameOver = true;
            document.getElementById("gameOverModal").classList.remove("hidden");
            const title = document.getElementById("modalTitle");
            const msg = document.getElementById("modalMessage");

            if (won) {
                title.innerText = "SZIPORKÁZÓ GYŐZELEM! ❄️✨";
                title.className = "game-font text-3xl md:text-5xl text-yellow-300 mb-2 ice-glow text-center";
                msg.innerText = `Kiszabadítottad a fagyos birodalmat! Végső pontszámod: ${score} 🍔`;
                soundEngine.playWin();
            } else {
                title.innerText = "JÁTÉK VÉGE ❄️";
                title.className = "game-font text-4xl md:text-6xl text-rose-400 mb-2 ice-glow text-center";
                msg.innerText = "Elfogyott az összes életed! Próbáld újra!";
            }
        }

        function winGame() {
            isGameWon = true;
            endGame(true);
        }

        /* ==========================================================================
           7. GRAFIKA ÉS RENDERELÉS
           ========================================================================== */
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // A. DÍSZELLŐ HÁTTÉR ÉS CSODÁS NEVEK (Jégvarázs stílus)
            ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
            ctx.font = "bold 28px 'Fredoka One', cursive";
            ctx.textAlign = "center";
            
            // Ismétlődő nevek a háttérben
            for (let x = 200; x < LEVEL_WIDTH; x += 600) {
                ctx.fillText("Ármika  •  Flóra  •  Anna  •  Emma  •  Sánci", x, 100);
                ctx.fillText("❄️ JÉGVARÁZS SAJTBURGER KALAND ❄️", x, 140);
            }

            // Hópelyhek rajzolása
            ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
            snowflakes.forEach(s => {
                s.y += s.speedY;
                s.x += s.speedX;
                if (s.y > canvas.height) s.y = 0;
                if (s.x > LEVEL_WIDTH) s.x = 0;
                if (s.x < 0) s.x = LEVEL_WIDTH;

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // B. PLATFORMOK RAJZOLÁSA
            platforms.forEach(p => {
                if (p.type === 'ice') {
                    // Jég talaj
                    ctx.fillStyle = "#38BDF8";
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = "#BAE6FD";
                    ctx.fillRect(p.x, p.y, p.width, 10); // Hó felszín
                } else {
                    // Lebegő fagyos platform
                    ctx.fillStyle = "#0284C7";
                    ctx.beginPath();
                    ctx.roundRect(p.x, p.y, p.width, p.height, 8);
                    ctx.fill();
                    ctx.fillStyle = "#E0F6FF";
                    ctx.fillRect(p.x + 4, p.y, p.width - 8, 4);
                }
            });

            // C. SAJTBURGEREK RAJZOLÁSA
            burgers.forEach(b => {
                if (!b.collected) {
                    ctx.font = "26px sans-serif";
                    ctx.fillText("🍔", b.x, b.y + 22);
                }
            });

            // D. ELLENFELEK (Hógolyók)
            enemies.forEach(e => {
                if (e.x > -100) {
                    ctx.font = "26px sans-serif";
                    ctx.fillText("☃️", e.x, e.y + 24);
                }
            });

            // E. CÉL ZÁSZLÓ
            ctx.fillStyle = "#CBD5E1";
            ctx.fillRect(goalFlag.x, goalFlag.y, 8, goalFlag.height);
            ctx.fillStyle = "#EF4444";
            ctx.beginPath();
            ctx.moveTo(goalFlag.x + 8, goalFlag.y);
            ctx.lineTo(goalFlag.x + 50, goalFlag.y + 20);
            ctx.lineTo(goalFlag.x + 8, goalFlag.y + 40);
            ctx.fill();
            ctx.font = "20px sans-serif";
            ctx.fillText("👑", goalFlag.x - 6, goalFlag.y - 10);

            // F. JÁTÉKOS RAJZOLÁSA
            const charStats = CHARACTERS[selectedCharKey];
            
            // Sebezhetetlenségi villogás
            if (player.invulnerableTimer % 6 < 3) {
                ctx.save();
                ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
                if (!player.facingRight) ctx.scale(-1, 1);

                // Karakter teste/háttere
                ctx.fillStyle = charStats.color;
                ctx.beginPath();
                ctx.roundRect(-player.width / 2, -player.height / 2, player.width, player.height, 10);
                ctx.fill();
                ctx.strokeStyle = "#FFFFFF";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Karakter ikona / arca
                ctx.font = "24px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(charStats.icon, 0, 0);

                ctx.restore();
            }

            ctx.restore();
        }

        /* ==========================================================================
           8. JÁTÉK CIKLUS INDÍTÁSA
           ========================================================================== */
        function gameLoop() {
            updatePhysics();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Kezdő inicializálás window onload-kor
        window.onload = () => {
            initLevel();
            requestAnimationFrame(gameLoop);
        };
    </script>
